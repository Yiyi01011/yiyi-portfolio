<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>P0 Hero Rebuild Preview</title>
    <style>
      :root {
        color-scheme: light;
        --page: #eef3ed;
        --ink: #26312d;
        --line: rgba(38, 49, 45, 0.2);
        --checker-a: #f5f3eb;
        --checker-b: #d9ded8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 28px;
        color: var(--ink);
        background: var(--page);
        font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      main {
        width: min(100%, 1500px);
        margin: 0 auto;
      }

      h1, h2 { margin: 0; font-size: 18px; font-weight: 650; }
      h2 { margin-bottom: 12px; font-size: 15px; }
      p { margin: 6px 0 0; color: #59645f; }
      section { margin-top: 32px; }

      .checks {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .check {
        min-height: 250px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 6px;
        position: relative;
      }

      .check.light { background: #f4f0e7; }
      .check.dark { background: #27312d; }
      .checker {
        background-color: var(--checker-a);
        background-image:
          linear-gradient(45deg, var(--checker-b) 25%, transparent 25%),
          linear-gradient(-45deg, var(--checker-b) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, var(--checker-b) 75%),
          linear-gradient(-45deg, transparent 75%, var(--checker-b) 75%);
        background-position: 0 0, 0 12px, 12px -12px, -12px 0;
        background-size: 24px 24px;
      }

      .check img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        position: absolute;
        inset: 0;
      }

      .label {
        position: absolute;
        z-index: 20;
        top: 8px;
        left: 8px;
        padding: 4px 7px;
        color: #25312c;
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(38, 49, 45, 0.14);
        border-radius: 3px;
        font-size: 11px;
      }

      .waterfall-panel {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 12px;
      }

      .waterfall-stage {
        min-height: 260px;
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 6px;
      }

      .waterfall-frame {
        width: 64px;
        height: 128px;
        background: url("../public/portfolio/environment/home/hero-waterfall-sprite.png") 0 0 / 256px 128px no-repeat;
        image-rendering: pixelated;
        filter: saturate(0.72) brightness(0.96);
      }

      .waterfall-loop {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        animation: waterfall-frames 720ms steps(1, end) infinite;
      }

      .frame-strip {
        display: grid;
        grid-template-columns: repeat(4, 64px);
        align-items: center;
        justify-content: center;
        gap: 18px;
        min-height: 260px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #f4f0e7;
      }

      .frame-strip .waterfall-frame:nth-child(2) { background-position-x: -64px; }
      .frame-strip .waterfall-frame:nth-child(3) { background-position-x: -128px; }
      .frame-strip .waterfall-frame:nth-child(4) { background-position-x: -192px; }

      @keyframes waterfall-frames {
        0%, 24.99% { background-position-x: 0; }
        25%, 49.99% { background-position-x: -64px; }
        50%, 74.99% { background-position-x: -128px; }
        75%, 100% { background-position-x: -192px; }
      }

      .hero-scroll {
        overflow-x: auto;
        padding-bottom: 8px;
      }

      .hero {
        width: 1440px;
        height: 900px;
        position: relative;
        overflow: hidden;
        background: linear-gradient(#dfece6 0%, #eef0df 55%, #e9eee7 100%);
        border: 1px dashed rgba(38, 49, 45, 0.28);
      }

      .hero .layer {
        position: absolute;
        display: block;
        pointer-events: none;
        user-select: none;
      }

      .clouds-far {
        z-index: 1;
        left: -80px;
        top: 18px;
        width: 1600px;
        height: 400px;
      }

      .clouds-mid {
        z-index: 2;
        left: 0;
        top: 216px;
        width: 1440px;
        height: 320px;
      }

      .terrain-main {
        z-index: 4;
        left: 0;
        top: 280px;
        width: 1440px;
        height: 648px;
      }

      .hero-waterfall {
        z-index: 7;
        position: absolute;
        left: 1197px;
        top: 607px;
        width: 36px;
        height: 72px;
        background-size: 144px 72px;
        filter: saturate(0.72) brightness(0.96);
        opacity: 0.88;
      }

      .avatar {
        z-index: 8;
        left: 850px;
        bottom: 295px;
        width: 200px;
        height: 300px;
        transform: translateX(-50%);
      }

      .safe-zone {
        z-index: 12;
        left: 92px;
        top: 82px;
        width: 520px;
        height: 250px;
        border: 1px dashed rgba(67, 88, 78, 0.38);
      }

      .safe-zone::after {
        content: "HTML title / intro / actions safe zone";
        position: absolute;
        top: 8px;
        left: 8px;
        color: rgba(38, 49, 45, 0.62);
        font-size: 11px;
      }

      @media (max-width: 800px) {
        body { padding: 18px; }
        .checks { grid-template-columns: 1fr; }
        .waterfall-panel { grid-template-columns: 1fr; }
      }

      @media (prefers-reduced-motion: reduce) {
        .waterfall-loop { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>P0 首页底部场景重构检查</h1>
        <p>仅用于素材透明度、瀑布循环与 1440×900 组合检查，不是正式页面。</p>
      </header>

      <section>
        <h2>连续地形透明检查</h2>
        <div class="checks">
          <div class="check light">
            <span class="label">浅色背景</span>
            <img src="../public/portfolio/environment/home/hero-terrain-main.png" alt="" />
          </div>
          <div class="check dark">
            <span class="label">深色背景</span>
            <img src="../public/portfolio/environment/home/hero-terrain-main.png" alt="" />
          </div>
          <div class="check checker">
            <span class="label">棋盘格背景</span>
            <img src="../public/portfolio/environment/home/hero-terrain-main.png" alt="" />
          </div>
        </div>
      </section>

      <section>
        <h2>瀑布四帧与循环检查</h2>
        <div class="waterfall-panel">
          <div class="waterfall-stage checker">
            <span class="label">720ms 四帧循环</span>
            <div class="waterfall-frame waterfall-loop"></div>
          </div>
          <div class="frame-strip">
            <div class="waterfall-frame"></div>
            <div class="waterfall-frame"></div>
            <div class="waterfall-frame"></div>
            <div class="waterfall-frame"></div>
          </div>
        </div>
      </section>

      <section>
        <h2>1440×900 完整 P0 组合</h2>
        <div class="hero-scroll">
          <div class="hero" id="hero-composite">
            <span class="label">1440 × 900 composite check</span>
            <img class="layer clouds-far" src="../public/portfolio/environment/home/hero-clouds-far.png" alt="" />
            <img class="layer clouds-mid" src="../public/portfolio/environment/home/hero-clouds-mid.png" alt="" />
            <img class="layer terrain-main" src="../public/portfolio/environment/home/hero-terrain-main.png" alt="" />
            <div class="waterfall-frame waterfall-loop hero-waterfall"></div>
            <img class="layer avatar" src="../public/portfolio/avatar/avatar-master.png" alt="" />
            <div class="layer safe-zone"></div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
